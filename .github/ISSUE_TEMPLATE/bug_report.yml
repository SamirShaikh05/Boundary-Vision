name: Bug report
description: Report a reproducible problem with Boundary Vision.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Do not include secrets or private information in logs or screenshots."
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is wrong?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include any visible error.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      description: For example, 0.1.0.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Include edition/version and architecture if known.
      placeholder: "Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Relevant logs or screenshots
      description: Paste relevant logs or attach screenshots. Redact personal data, tokens, and private file paths.
      render: text
    validations:
      required: false
